# Helm values layer 3 of __DEV_ENV__/__FLOW__/__APP__/__INSTANCE_A__. image.tag equals IMAGE_TAG in the
# sibling compose.env (the write-back rewrites both); identity and env.APP_* restate the directory path; env
# holds app-facing variables only, never a secret.
image:
  tag: "__IMAGE_TAG__"
identity:
  env: __DEV_ENV__
  flow: __FLOW__
  app: __APP__
  instance: __INSTANCE_A__
env:
  APP_ENV: __DEV_ENV__
  APP_FLOW: __FLOW__
  APP_NAME: __APP__
  APP_INSTANCE: __INSTANCE_A__
  JAVA_OPTS: "-XX:MaxRAMPercentage=75"
  LOG_LEVEL_ROOT: INFO
