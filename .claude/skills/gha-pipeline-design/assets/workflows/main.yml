# Main pipeline: everything, on every merge.
#
#   build (every project, images pushed with the pre-release tags) -> integration-test (per project)
#   -> publish (re-assert the tags on exactly the tested digests) -> deploy-dev (main only)
#   -> the deploy writes the deployed tag back to the config tree as a `[skip ci]` commit.
# hotfix/** branches run the same pipeline without deploy-dev.
#
# Loop guard: the write-back commit carries `[skip ci]`, every root job skips runs whose actor is the
# write-back identity, and such runs get their own concurrency group so they never displace a queued merge.
# (With GITHUB_TOKEN a bot push starts no run at all; the guard matters once a GitHub App token pushes.)
#
# Placeholders:
#   __BOT_LOGIN__   the identity that pushes write-back commits, e.g. github-actions[bot] or <app-slug>[bot]
#
# Optional jobs (delete them and their `needs:` entries if not adopted):
#   integration-test  skill gha-ephemeral-test-envs
#   publish           skill gha-versioning-release (_promote.yml)
#   deploy-dev        skill gha-config-deploy (_deploy-dev.yml)
# Add a system-test (the integration workflow at a wider level) and kind-deploy (_kind-deploy.yml) between
# integration-test and publish when the repository has them.
name: main

on:
  push:
    branches: [main, 'hotfix/**']

concurrency:
  # Runs queue per branch and are never cancelled: a cancelled deploy is worse than a late one.
  group: ${{ github.actor == '__BOT_LOGIN__' && format('main-bot-{0}', github.run_id) || format('main-{0}', github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.actor != '__BOT_LOGIN__'
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
      packages: write
    with:
      projects: all
      build-images: true
      push-images: true
      ignore-head-tags: true

  integration-test:
    needs: build
    if: needs.build.outputs.it-projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.build.outputs.it-projects) }}
    uses: ./.github/workflows/_integration-test.yml
    permissions:
      contents: read
      packages: read
    with:
      project: ${{ matrix.project }}
      images: ${{ needs.build.outputs.images }}
      retention-days: 14

  publish:
    # Nothing downstream (deploys, releases) consumes an image before this gate has passed.
    needs: [build, integration-test]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.integration-test.result == 'success' || needs.integration-test.result == 'skipped') }}
    uses: ./.github/workflows/_promote.yml
    permissions:
      contents: read
      packages: write
    with:
      images: ${{ needs.build.outputs.images }}
      tags: ${{ needs.build.outputs.image-tags }}

  deploy-dev:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && github.actor != '__BOT_LOGIN__'
    uses: ./.github/workflows/_deploy-dev.yml
    permissions:
      contents: write
      deployments: write
      packages: read
    with:
      tag: ${{ needs.build.outputs.version }}
      images: ${{ needs.build.outputs.images }}
    secrets: inherit
