# _integration-test.yml: reusable integration-test job for ONE project; call it once per matrix entry.
# (Template of the skill gha-ephemeral-test-envs.)
#
#   stack up (the project's dependency stacks + the image under test, by digest) -> the tests in the
#   test-runner container on the stack network (no published ports) -> diagnostics on failure -> teardown
#   and leak check on success, failure AND cancel (always()) -> test summary and report upload.
#
# Interface (the pr.yml / main.yml templates of gha-pipeline-design call it unchanged):
#   inputs  project         string, required   project id: one matrix entry, the key of `images` and stacks.yml
#           images          string, required   JSON object project -> image pinned by digest, e.g.
#                                              {"services/api":"ghcr.io/o/api:pr-4-abc1234@sha256:..."}
#           retention-days  number, default 7  retention of reports and diagnostics (e.g. 14 on main)
#           optional        image-required, app-compose-file, app-service, test-runner-image, timeout-minutes,
#                           name-suffix
#   callers grant: permissions: contents: read, packages: read
#
# Placeholders (list what is left with: grep -rn '__[A-Z0-9_]*__' .github test-infra):
#   __REGISTRY__          registry of the image under test and the runner image, e.g. ghcr.io
#   __APP_COMPOSE_FILE__  compose file of the app under test, {project} = the project id,
#                         e.g. {project}/compose.test.yml
#   __TEST_COMMAND__      the tests, run by `docker compose run --rm test-runner` in /workspace for "$PROJECT":
#                           Gradle  ./gradlew "${PROJECT}:integrationTest" --no-daemon
#                           Maven   mvn -B -ntp -pl "$PROJECT" verify -Pintegration-tests
#                           pnpm    pnpm --filter "./$PROJECT" run test:integration
#                           Go      go test -tags=integration "./$PROJECT/..."
#                           Python  python -m pytest "$PROJECT/tests/integration" --junitxml="$PROJECT/build/it/TEST-it.xml"
#   __TEST_RESULTS__      JUnit XML files, an upload-artifact glob, e.g. **/build/test-results/integrationTest/**
#                         (Maven: **/target/failsafe-reports/**). junit-summary.sh looks for TEST-*.xml;
#                         set JUNIT_GLOB on the summary step for other names.
# Third-party actions are pinned to the major that ran green in the reference; update to the current major.
name: _integration-test

on:
  workflow_call:
    inputs:
      project:
        description: Project id, one matrix entry (the key of `images` and of stacks.yml), e.g. services/api.
        type: string
        required: true
      images:
        description: JSON object project -> image pinned by digest (the build job's `images` output).
        type: string
        required: true
      retention-days:
        description: Retention of the uploaded reports and diagnostics (e.g. 7 on PRs, 14 on main).
        type: number
        default: 7
      image-required:
        description: "false lets a project without an image (a library) run its stack without an app under test."
        type: boolean
        default: true
      app-compose-file:
        description: Compose file of the app under test ({project} = the project id); '' runs the stack without the app.
        type: string
        default: '__APP_COMPOSE_FILE__'
      app-service:
        description: Service of the app compose file that runs APP_IMAGE (publishes no port in CI).
        type: string
        default: app
      test-runner-image:
        description: Image of the test-runner service; empty keeps TEST_RUNNER_IMAGE of versions.env.
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout; the always() teardown still runs when it strikes.
        type: number
        default: 30
      name-suffix:
        description: >-
          Appended to the stack name (e.g. -3) where jobs share one container engine (persistent
          self-hosted runners); it also narrows teardown and leak check to the stack's own project label.
        type: string
        default: ''
    outputs:
      diagnostics-artifact:
        description: Name of the diagnostics artifact (uploaded only when the job fails).
        value: ${{ jobs.it.outputs.diagnostics-artifact }}

permissions:
  contents: read

jobs:
  it:
    name: integration (${{ inputs.project }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    env:
      # One stack per job, named by the job (not by `up`) so teardown finds it even when up never finished.
      # Unique per run AND attempt: a re-run never meets the first attempt's resources.
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.name-suffix }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      STACK_SCOPE: ${{ inputs.name-suffix != '' && 'project' || 'run' }}
      PROJECT: ${{ inputs.project }}
      # The image under test is the digest built in this run, never a floating tag.
      APP_IMAGE: ${{ fromJSON(inputs.images)[inputs.project] }}
    outputs:
      diagnostics-artifact: ${{ steps.check.outputs.diagnostics }}
    steps:
      - uses: actions/checkout@v7

      - name: Check inputs
        id: check
        env:
          IMAGE_REQUIRED: ${{ inputs.image-required }}
          APP_FILE_PATTERN: ${{ inputs.app-compose-file }}
          RUNNER_IMAGE_INPUT: ${{ inputs.test-runner-image }}
          NAME_SUFFIX: ${{ inputs.name-suffix }}
        run: |
          set -euo pipefail
          if [[ -n $NAME_SUFFIX && ! $NAME_SUFFIX =~ ^-[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::name-suffix must look like -<a-z 0-9 _ ->, got '$NAME_SUFFIX'"
            exit 2
          fi
          app_file=''
          if [[ -n $APP_IMAGE ]]; then
            if [[ ! $APP_IMAGE =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the image of $PROJECT is not pinned by digest: '$APP_IMAGE'"
              exit 2
            fi
            # An explicitly empty app-compose-file runs the stack without the app container.
            if [[ -n $APP_FILE_PATTERN ]]; then
              app_file=${APP_FILE_PATTERN//'{project}'/$PROJECT}
              [[ -f $app_file ]] || { echo "::error::$app_file (the compose file of the app under test) does not exist"; exit 2; }
            fi
          elif [[ $IMAGE_REQUIRED == true ]]; then
            echo "::error::no image for $PROJECT in the images input (a project without an image: pass image-required: false)"
            exit 2
          else
            echo "::notice::no image for $PROJECT: the stack runs without an app under test"
          fi
          if [[ -n $RUNNER_IMAGE_INPUT ]]; then echo "TEST_RUNNER_IMAGE=$RUNNER_IMAGE_INPUT" >> "$GITHUB_ENV"; fi
          slug=$(tr '[:upper:]' '[:lower:]' <<<"$PROJECT" | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          {
            echo "app-file=$app_file"
            echo "slug=${slug:-project}"
            echo "diagnostics=it-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${slug:-project}"
          } >> "$GITHUB_OUTPUT"

      # GHCR with the job token (packages: read). JFrog: an OIDC token exchange instead of a stored password;
      # ECR: aws-actions/configure-aws-credentials + aws-actions/amazon-ecr-login.
      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: __REGISTRY__
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The test-runner's build cache: the host cache, restored read-only here (only the build job writes
      # it) and mounted at /cache. Gradle form. Others: actions/cache/restore on the tool's cache directory
      # (Maven ~/.m2/repository, npm ~/.npm, pnpm its store, Go ~/go/pkg/mod, pip ~/.cache/pip), point
      # TEST_CACHE_DIR at it, and set the matching variable in test-runner.yml.
      - name: Build cache for the test runner
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Point the test runner at the cache
        run: echo "TEST_CACHE_DIR=$HOME/.gradle" >> "$GITHUB_ENV"

      - name: Start the stack (pull, up --wait)
        uses: ./.github/actions/compose-stack
        with:
          command: up
          project: ${{ inputs.project }}
          files: ${{ steps.check.outputs.app-file }}
          app-service: ${{ steps.check.outputs.app-file != '' && inputs.app-service || '' }}

      - name: Integration tests in the test-runner container
        run: |
          set -euo pipefail
          read -r -a compose <<<"${COMPOSE_BIN:-docker compose}"
          "${compose[@]}" run --rm test-runner __TEST_COMMAND__

      - name: Diagnostics before teardown
        if: failure()
        uses: ./.github/actions/compose-stack
        with:
          command: diagnostics
          diagnostics-dir: build/ci-logs

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.check.outputs.diagnostics || format('it-diagnostics-{0}-{1}', github.run_id, github.run_attempt) }}
          path: |
            build/ci-logs/**
            __TEST_RESULTS__
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}

      - name: Teardown (success, failure and cancel)
        if: always()
        uses: ./.github/actions/compose-stack
        with:
          command: down

      - name: Leak check
        if: always()
        uses: ./.github/actions/compose-stack
        with:
          command: leak-check

      - name: Test summary
        if: always()
        run: scripts/ci/junit-summary.sh "Integration tests (${PROJECT})"

      - name: Upload test results
        if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: it-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.check.outputs.slug }}
          path: '__TEST_RESULTS__'
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
