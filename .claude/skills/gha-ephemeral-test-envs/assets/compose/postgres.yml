# postgres.yml: an EXAMPLE dependency stack; copy its shape for each dependency (database, broker, cache).
# (Template of the skill gha-ephemeral-test-envs; no placeholders, the image comes from versions.env.)
#
# Conventions stack.sh relies on:
#   - the file <name>.yml defines the service <name> (helpers it needs are its depends_on);
#   - the image comes from the environment / versions.env, pinned by digest;
#   - a health check, so `up --wait` returns only when the service really answers;
#   - labels on the service and on every named volume; no `ports:` (<name>.local.yml publishes them for
#     laptops only);
#   - test-only secrets listed in x-stack-secrets: stack.sh generates them per stack when unset.
x-ci-labels: &ci-labels
  com.example.ci.run: "${CI_RUN_ID:-local}"
  com.example.ci.attempt: "${CI_RUN_ATTEMPT:-0}"

# Generated by `stack.sh up` when unset (random, reused on a re-run of the same stack, masked in CI).
x-stack-secrets: [DB_PASSWORD]

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is not set - see versions.env}
    environment:
      POSTGRES_USER: test
      POSTGRES_DB: test
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - stack.sh up generates it}
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    volumes:
      # The image declares VOLUME /var/lib/postgresql/data (check yours with
      # docker image inspect -f '{{json .Config.Volumes}}' <image>). Without this line the engine creates an
      # anonymous volume that carries no label, so the leak check could not see it. A named volume carries
      # the labels, takes the image directory's ownership and goes with `down -v`.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, the path the tests use: the image's init phase runs a temporary server on the Unix socket
      # only, which a socket probe would report as ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U test -d test"]
      # Budget: start_period + retries x interval must fit inside STACK_WAIT_TIMEOUT (180 s by default).
      start_period: 10s
      interval: 3s
      timeout: 5s
      retries: 30
    labels: *ci-labels

volumes:
  postgres-data:
    labels: *ci-labels
