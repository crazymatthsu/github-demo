# app.compose.yml: EXAMPLE compose file of the app under test, kept next to the project (for example
# services/api/compose.test.yml) and passed as `stack.sh up --file <it> --app-service app`.
# (Template of the skill gha-ephemeral-test-envs; no placeholders, adapt the environment and probe.)
#
# - image: APP_IMAGE, the image built in this run and pinned by digest (never a floating tag);
# - starts only after its dependencies are healthy (depends_on ... service_healthy);
# - relative paths resolve against base.yml's directory (the first file), not this file's: use
#   ${TEST_WORKSPACE}/... for anything mounted from the repository;
# - its ports are for laptops: in CI `--app-service app` merges `ports: !reset []` over them, and the tests
#   reach it as app:8080 on the stack network.
x-ci-labels: &ci-labels
  com.example.ci.run: "${CI_RUN_ID:-local}"
  com.example.ci.attempt: "${CI_RUN_ATTEMPT:-0}"

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is not set - the image under test, e.g. <repo>:<tag>@sha256:<digest>}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/test
      DB_USER: test
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - stack.sh up generates it}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    # Delete this block when the image has its own HEALTHCHECK; the probe binary must exist in the image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: ${APP_MEM_LIMIT:-768m}
    labels: *ci-labels
