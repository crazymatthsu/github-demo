# test-infra/compose/local-ports.yml: published ports for local development only (D10 §5.6, §6.6).
#
# `stack.sh up --local` (Gradle composeUp / devUp) adds this file, so a host JVM or a SQL client
# reaches the stack on localhost. All ports are above 1024 (fine for rootless Podman) and bound to
# 127.0.0.1 only. CI never uses this file.
#
# Compose rejects an override for a service the stack does not define, so stack.sh passes a copy
# filtered to the services of the stack. Keep the shape: one two-space-indented `<service>:` block
# per service under `services:`.
services:
  deephaven:
    ports:
      - "127.0.0.1:${DEEPHAVEN_HOST_PORT:-10000}:10000"
  sqlserver:
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-1433}:1433"
  kafka:
    ports:
      # The PLAINTEXT_HOST listener, which advertises localhost:9092 (kafka.yml).
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:19092"
