# Main pipeline (D7 §5.1, §6.10, Figure 3; D9 §6.4; D10 §5.2).
#
#   build (all, images pushed with the pre-release tags) ─┬─ integration-test (all, component)
#                                                         └─ config-lint
#   integration-test → system-test (our images incl. deephaven-server) → publish (verify + `main` tag)
#   → deploy-dev (Environment dev, main only) → tag write-back `[skip ci]`
#
# Loop guard (DL-36): the write-back commit carries `[skip ci]`, and every root job skips runs whose
# actor is the write-back bot. (With GITHUB_TOKEN the bot's push triggers no workflow at all; the
# guards matter once a GitHub App token does the write-back — then name that App's actor here.)
# hotfix/* branches run the same pipeline without deploy-dev (D4 §6.6).
name: main

on:
  push:
    branches: [main, 'hotfix/**']

concurrency:
  # Runs queue per branch and are never cancelled (a cancelled deploy-dev is worse than a late one).
  # Bot runs get their own group so they can never displace a queued human merge.
  group: ${{ github.actor == 'github-actions[bot]' && format('main-bot-{0}', github.run_id) || format('main-{0}', github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/_gradle-build.yml
    permissions:
      contents: read
      packages: write
    with:
      projects: all
      build-images: true
      push-images: true
      ignore-head-tags: true

  config-lint:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/config-lint.yml
    permissions:
      contents: read

  integration-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.build.outputs.it-projects) }}
    uses: ./.github/workflows/_integration-test.yml
    permissions:
      contents: read
      packages: read
    with:
      project: ${{ matrix.project }}
      images: ${{ needs.build.outputs.images }}
      level: component
      ci-build-image: ${{ needs.build.outputs.ci-build-image }}
      retention-days: 14

  system-test:
    needs: [build, integration-test]
    uses: ./.github/workflows/_integration-test.yml
    permissions:
      contents: read
      packages: read
    with:
      # The reference scenario (D8 §5.2) against this run's images, including our deephaven-server (DL-26).
      project: ':deephaven-connectors:source-database'
      images: ${{ needs.build.outputs.images }}
      level: system
      ci-build-image: ${{ needs.build.outputs.ci-build-image }}
      retention-days: 14

  publish:
    needs: [build, system-test, config-lint]
    uses: ./.github/workflows/_docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      # The build job pushed the D4 set (<next>-rc.<n>, sha-<sha7>, main) so the IT jobs on other
      # runners can pull the digests. After the system test, publish re-asserts every tag on exactly
      # the tested digests (a tag pointing elsewhere is moved if convenience, refused if immutable);
      # deploy-dev and release.yml consume nothing before this gate has passed.
      images: ${{ needs.build.outputs.images }}
      tags: ${{ needs.build.outputs.image-tags }}

  deploy-dev:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/_deploy-dev.yml
    permissions:
      contents: write
      deployments: write
    with:
      env: us-dev
      tag: ${{ needs.build.outputs.version }}
      images: ${{ needs.build.outputs.images }}
    secrets: inherit
