# Helm values layer 3 (D11 §6.2) of us-dev/cash/source-database/trades-db-to-amps.
# image.tag equals IMAGE_TAG in the sibling compose.env (the deploy-dev write-back rewrites both, D5 §6.8);
# identity and the APP_* variables restate the directory path (config-lint check 4); app-facing variables
# only, never secrets (D5 §6.3).
image:
  tag: "0.1.0-rc.85"
identity:
  env: us-dev
  flow: cash
  app: source-database
  instance: trades-db-to-amps
env:
  APP_ENV: us-dev
  APP_FLOW: cash
  APP_NAME: source-database
  APP_INSTANCE: trades-db-to-amps
  JAVA_OPTS: "-XX:MaxRAMPercentage=75"
  LOG_LEVEL_ROOT: INFO
