# Deploy-dev inventory of us-dev/cash (D5 §6.6, D9 §6.4–§6.5): one file per flow, owned with the flow directory
# (CODEOWNERS on config/<env>/<flow>/**); one target per instance directory of the flow, checked by configLint
# (check 11). A target's instance is <AppName>/<AppInstance>, relative to this flow; kind, cluster, namespace,
# host and user come from the target, else from defaults.
#   pool     the bare-metal boxes of us-dev/cash (DL-39): every box receives the flow's host bundle (the compose
#            runtime plus every app, instance and layer of the flow) under `root`, so any instance of the flow can
#            run on any box. `user` is the SSH user of DL-35 (forced command run-compose.sh). scripts/pool-deploy.sh
#            syncs and deploys; deploy-dev's runner plays every box (transport local) until the boxes exist and
#            the Environment dev holds DEV_DEPLOY_SSH_KEY with config/us-dev/known_hosts.
#   compose  demo step 1: run-compose.sh pull / start / health on a box of the pool. `host` is the recorded
#            placement, not a fixed one: absent until the first deploy resolves it (pinned → discovered →
#            assigned), then written back by deploy-dev with the tag; a PR that changes it moves the instance.
#            Without a pool, a compose target needs its own `host`.
#   helm     demo step 2: helm upgrade --install into `cluster`, namespace `namespace` (default: the flow name,
#            DL-38; "{flow}" stands for it). cluster kind-ci = a throwaway kind cluster inside the deploy-dev job
#            until a dev cluster exists (DL-32); any other cluster needs its kubeconfig from the Environment dev
#            secrets (Phase 3) and fails the deploy until then.
# Layout: yq v4's own (one space before a trailing comment), so the write-back's yq edit changes one line.
env: us-dev
flow: cash
pool: # optional: the bare-metal boxes of us-dev/cash
  hosts: # non-empty, unique, lower-case DNS names (or IPv4)
    - dev-cash-01.us-dev.example.com
    - dev-cash-02.us-dev.example.com
  user: deploy # default deploy (DL-35 forced command)
  root: /opt/platform # default /opt/platform: the install root of the bundle on every box
defaults:
  kind: helm
  cluster: kind-ci
  namespace: cash # default: the flow name; the literal "{flow}" is still accepted
targets:
  - instance: source-database/trades-db-to-amps # <AppName>/<AppInstance>, relative to this flow
    kind: compose # any box of the pool; `host` is the placement the write-back records
  - instance: source-database/positions-db-to-deephaven # inherits the helm defaults
