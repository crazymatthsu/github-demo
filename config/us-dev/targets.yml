# Deploy-dev inventory of us-dev (D5 §6.6, D9): one target per instance directory, checked by configLint
# (check 11). Demo step 1: compose hosts, reached by the deploy-dev placeholder only as a dry run
# (TODO(DL-35): SSH to the host as the `deploy` user, forced command run-compose.sh). Demo step 2 switches
# the defaults to kind: helm with cluster and namespace.
env: us-dev
defaults:
  kind: compose
  user: deploy                  # DL-35: SSH user whose forced command is run-compose.sh
targets:
  - instance: cash/source-database/trades-db-to-amps
    kind: compose
    host: dev-compose-01.us-dev.example.com
  - instance: cash/source-database/positions-db-to-deephaven
    kind: compose
    host: dev-compose-01.us-dev.example.com
