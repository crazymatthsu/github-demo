# Helm values layer 2 (D11 §6.2) — source-kafka in local / cash, shared by every instance: sizing and the
# time zone (compose.env says MEM_LIMIT=768m and TZ=UTC for compose). Layer 1 is the chart
# (deephaven-connectors/source-kafka/helm/source-kafka/values.yaml), layer 3 <AppInstance>/values.yaml.
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 768Mi
env:
  TZ: UTC
