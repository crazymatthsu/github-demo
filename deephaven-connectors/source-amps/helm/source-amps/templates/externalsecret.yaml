{{- if .Values.secrets.externalSecret.enabled }}
{{- /*
Phase 3 (DL-31, D2 §6.6, §8.1): External Secrets Operator writes the very Secret the Deployment mounts
(<release>-secrets, keys = Spring property names) from Vault. Later dataFrom entries win, so the instance
path comes last. Every path must exist in Vault (verify: a missing one fails the sync).
*/}}
{{- $id := .Values.identity }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "connector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # the Secret must exist before the pod (D11 §6.6)
spec:
  refreshInterval: {{ $es.refreshInterval | default "1m" }}
  secretStoreRef:
    kind: {{ $es.storeKind | default "ClusterSecretStore" }}
    name: {{ $es.storeRef | default (printf "vault-%s" $id.env) }}
  target:
    name: {{ include "connector.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract: { key: {{ printf "%s/_common" $id.env | quote }} }
    - extract: { key: {{ printf "%s/%s/%s/app-common" $id.env $id.flow $id.app | quote }} }
    - extract: { key: {{ $es.vaultPath | default (printf "%s/%s/%s/%s" $id.env $id.flow $id.app $id.instance) | quote }} }
{{- end }}
