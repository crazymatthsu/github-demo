# Layer 1 — jar defaults of source-database (D5 §6.1): safe, environment-agnostic defaults and the import list.
# Everything environment-specific comes from the config tree, mounted read-only under /config/<layer>/:
#   /config/platform  <- config/_common/<AppName>/                     (optional)
#   /config/env       <- config/<env>/_common/                         (optional)
#   /config/common    <- config/<env>/<flow>/<AppName>/app-common/
#   /config/instance  <- config/<env>/<flow>/<AppName>/<AppInstance>/
# Later imports override earlier ones; /secrets/ (Kubernetes Secret, one file per property) comes last.
# Secrets are never set here (D2 §8.1). Identity: APP_ENV, APP_FLOW, APP_NAME, APP_INSTANCE (environment).
spring:
  application:
    name: source-database
  config:
    import:
      - optional:file:/config/platform/application.yml
      - optional:file:/config/env/application.yml
      - optional:file:/config/common/application.yml
      - optional:file:/config/instance/application.yml
      - optional:configtree:/secrets/
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # Endpoint from connector.source.* (config tree); username and password are never set in YAML: they
    # arrive as SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD or as /secrets/ files (D2 §6.4).
    url: jdbc:sqlserver://${connector.source.host:localhost}:${connector.source.port:1433};databaseName=${connector.source.database:master};encrypt=true
    hikari:
      pool-name: source-database
      maximum-pool-size: 2
      # The hello-world query must fail fast when the database is absent (the app keeps running).
      connection-timeout: 10000 # milliseconds
  sql:
    init:
      mode: never

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # connectorconfig: the masked configuration summary for `run-compose.sh ... app-config` (D6 §4.3).
        include: health,info,prometheus,connectorconfig
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          # The framework's `connector` indicator gates readiness (D6 §6.9).
          include: readinessState,connector
  info:
    java:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    # The identity tuple on every plain-text line (D6 §6.9); JSON formats carry it as fields (below).
    level: "%5p [${APP_ENV:local}/${APP_FLOW:none}/${APP_NAME:${spring.application.name}}/${APP_INSTANCE:none}]"
  structured:
    json:
      add:
        env: ${APP_ENV:local}
        flow: ${APP_FLOW:none}
        app: ${APP_NAME:${spring.application.name}}
        instance: ${APP_INSTANCE:none}

connector:
  source:
    poll-interval: 30s
  sink:
    type: stub
